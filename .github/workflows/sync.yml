name: Aktualizuj spolszczenia.json
on:
  schedule:
    - cron: "*/30 * * * *"   # co 30 minut
  workflow_dispatch:           # przycisk "Run workflow" do ręcznego uruchomienia
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync.mjs
      - name: Generuj strony Aktualności
        if: always()
        run: node scripts/news.mjs
      - name: Generuj strony gier (test)
        if: always()
        run: node scripts/gry.mjs
      - name: Zapisz zmiany
        if: always()
        run: |
          git add -A spolszczenia.json aktualnosci gra sitemap.xml
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "spolszczenia-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "Automatyczna aktualizacja katalogu i aktualności"
            git push
          fi
