name: Sprzątanie okładek na R2
# Co tydzień (niedziela ok. 4:17 czasu polskiego) usuwa z R2 okładki, których żadna gra nie używa od co najmniej 30 dni.
# Można też uruchomić ręcznie (Actions → „Sprzątanie okładek na R2” → Run workflow).
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: okladki-r2
jobs:
  sprzataj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - name: Usuń nieużywane okładki (po 30 dniach)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/okladki-r2-sprzataj.py
      - name: Zapisz stan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp scripts/okladki-r2-nieuzywane.json /tmp/stan.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/stan.json scripts/okladki-r2-nieuzywane.json
            git add scripts/okladki-r2-nieuzywane.json
            git diff --cached --quiet && { echo "Brak zmian."; exit 0; }
            git commit -q -m "Okładki R2: stan sprzątania"
            git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
