name: Aktualizuj spolszczenia.json
on:
  schedule:
    - cron: "*/30 * * * *"   # co 30 minut
  workflow_dispatch:           # przycisk "Run workflow" do ręcznego uruchomienia
    inputs:
      czekaj:
        description: "Ile sekund poczekać na zebranie zmian ze strony (0 = od razu; strona wysyła 120)"
        required: false
        default: "0"
      discord_test:
        description: "Wyślij wiadomość testową na Discord"
        type: boolean
        default: false
permissions:
  contents: write
# Nigdy dwa automaty naraz: kolejne uruchomienia czekają w kolejce (GitHub trzyma najwyżej jedno oczekujące).
concurrency:
  group: aktualizacja-katalogu
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Po zapisie na stronie (funkcja Supabase „odswiez”) automat czeka chwilę i zbiera wszystkie zmiany naraz.
      - name: Zebranie zmian ze strony (czekanie)
        if: github.event_name == 'workflow_dispatch'
        env:
          CZEKAJ: ${{ inputs.czekaj }}
        run: |
          s="$CZEKAJ"; case "$s" in ''|*[!0-9]*) s=0;; esac; [ "$s" -gt 300 ] && s=300
          echo "Czekam $s s"; sleep "$s"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import gier (jednorazowy)
        run: node scripts/import.mjs
      - run: node scripts/sync.mjs
      - name: Nowe okładki na R2 (cdn.grypopolsku.pl)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TRYB: wgraj
          LIMIT: "60"
        run: |
          # tylko gdy jest okładka spoza cdn.grypopolsku.pl (i nie na liście niedziałających) – inaczej nic nie instaluje
          if python3 -c "import json,os,sys;b=json.load(open('scripts/okladki-r2-bledy.json')) if os.path.exists('scripts/okladki-r2-bledy.json') else {};d=json.load(open('spolszczenia.json'));sys.exit(0 if any(str(g.get('img') or '').startswith('http') and not str(g.get('img')).startswith('https://cdn.grypopolsku.pl/') and g.get('img') not in b for g in d) else 1)"; then
            python3 -m venv /tmp/okl && /tmp/okl/bin/pip install -q pillow boto3 && /tmp/okl/bin/python scripts/okladki-r2.py && python3 scripts/okladki-r2-zastosuj.py
          else
            echo "Brak nowych okładek."
          fi
      - name: Zrzuty ekranu z gier (R2 zrzuty/<klucz-gry>/ -> galeria na stronie gry)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          [ -x /tmp/okl/bin/python ] || { python3 -m venv /tmp/okl && /tmp/okl/bin/pip install -q pillow boto3; }
          /tmp/okl/bin/python scripts/zrzuty-r2.py
      - name: Pliki z folderu do-r2/ na R2 (np. obrazki do Aktualności)
        if: hashFiles('do-r2/**') != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          [ -x /tmp/okl/bin/python ] || { python3 -m venv /tmp/okl && /tmp/okl/bin/pip install -q pillow boto3; }
          /tmp/okl/bin/python scripts/do-r2.py
      - name: Obrazki Aktualności na R2 – WebP (+ kopia .og.jpg do podglądu linku)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          [ -x /tmp/okl/bin/python ] || { python3 -m venv /tmp/okl && /tmp/okl/bin/pip install -q pillow boto3; }
          /tmp/okl/bin/python scripts/aktualnosci-r2.py
      - name: Generuj strony Aktualności
        if: always()
        run: node scripts/news.mjs
      - name: Generuj strony gier (test)
        if: always()
        run: node scripts/gry.mjs
      - name: Komentarze na Discordzie
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_COMMENTS: ${{ secrets.DISCORD_WEBHOOK_COMMENTS }}
          DISCORD_TEST: ${{ github.event.inputs.discord_test }}
          KOM_ONLY: "1"
        run: node scripts/discord.mjs
      - name: Zapisz zmiany
        if: always()
        run: |
          git add -A spolszczenia.json katalog-czas.json aktualnosci gra sitemap.xml index.html scripts/discord-komentarze.json scripts/okladki-r2-mapa.json scripts/okladki-r2-bledy.json
          git rm -q --cached --ignore-unmatch import-lektor.json
          git add -A do-r2 2>/dev/null || true   # folder do-r2/ znika po wgraniu plików na R2
          echo "PRE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "spolszczenia-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "Automatyczna aktualizacja katalogu i aktualności"
            git push && echo "PUSHED=1" >> "$GITHUB_ENV"
          fi
      - name: Ogłoszenia na Discordzie
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_COMMENTS: ${{ secrets.DISCORD_WEBHOOK_COMMENTS }}
          DISCORD_TEST: ${{ github.event.inputs.discord_test }}
        run: node scripts/discord.mjs
