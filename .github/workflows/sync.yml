name: Aktualizuj spolszczenia.json
on:
  schedule:
    - cron: "*/30 * * * *"   # co 30 minut
  workflow_dispatch:           # przycisk "Run workflow" do ręcznego uruchomienia
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync.mjs
      - name: Zapisz zmiany
        run: |
          if [ -n "$(git status --porcelain spolszczenia.json)" ]; then
            git config user.name "spolszczenia-bot"
            git config user.email "bot@users.noreply.github.com"
            git add spolszczenia.json
            git commit -m "Automatyczna aktualizacja katalogu"
            git push
          fi
